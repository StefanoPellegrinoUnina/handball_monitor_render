services:
  - type: web
    name: handball-monitor-italia
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: Europe/Rome
      - key: AUTO_SYNC_ON_EMPTY_DB
        value: "1"
      - key: DISABLE_SCHEDULER
        value: "1"
      - key: SCHEDULE_HOURS
        value: "7,23"
      - key: SYNC_TOKEN
        generateValue: true
